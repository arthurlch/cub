name: build-and-test

on:
  push:
    branches:
      - main
      - master
      - "feature/*"
      - "audit/*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Benchmarks and allocation smoke
        run: go test -run '^$' -bench . -benchmem -benchtime=20x ./internal/editor/ ./internal/tui/

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4.5.0
        with:
          files: ./coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build binary
        run: go build -o cub ./cmd/cub

      - name: CLI smoke test
        run: |
          ./cub --version
          ./cub --help | grep -q "view mode" || { echo "help output missing keybindings"; exit 1; }

      - name: Install expect
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y expect
          else
            command -v expect >/dev/null || brew install expect
          fi

      - name: End-to-end (expect)
        run: |
          chmod +x tests/expect_test.sh
          ./tests/expect_test.sh ./cub

  cross-build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all targets
        run: make build-all

      - name: Verify artifacts
        run: |
          for target in darwin-amd64 darwin-arm64 windows-amd64 linux-amd64; do
            if [ ! -f "./bin/cub_${target}" ]; then
              echo "Missing binary: bin/cub_${target}"
              exit 1
            fi
          done
          echo "All cross-compiled binaries present."
